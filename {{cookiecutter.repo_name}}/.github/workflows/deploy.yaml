{% raw %}
name: Cross-Platform Build, Deploy & Release

# -----------------------------------------------------------------------------
# Purpose
# -----------------------------------------------------------------------------
# This workflow performs the complete production release after code has been
# merged into the main branch.
#
# Release flow:
#
#   merge into main
#       ↓
#   read and validate release metadata
#       ↓
#   build protected Cython wheels for all supported platforms
#       ↓
#   upload wheels to Wasabi PyPI
#       ↓
#   verify package installation
#       ↓
#   create Git tag
#       ↓
#   create GitHub Release
#
# The deployment wheels are built through:
#
#   resources/scripts/deploy.py
#
# That script creates an isolated staging copy of the repository, enables
# Cython for the release build, compiles protected Python modules into native
# extensions, runs cibuildwheel, verifies the resulting wheels, and copies the
# verified artifacts into wheelhouse.
#
# No Git tag or GitHub Release is created until all wheels have successfully
# been uploaded and installation-tested.
#
# pyproject.toml is the canonical source of the package version.
#
# Example:
#
#   pyproject.toml:
#       version = "2026.8.1"
#
#   resulting Git tag:
#       v2026.8.1
#
#   resulting GitHub Release:
#       v2026.8.1
# -----------------------------------------------------------------------------

on:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    # -------------------------------------------------------------------------
    # STEP 1: Read and validate release metadata
    # -------------------------------------------------------------------------
    prepare-release:
        name: Prepare release
        runs-on: ubuntu-latest

        outputs:
            package-name: ${{ steps.package.outputs.name }}
            package-version: ${{ steps.package.outputs.version }}
            release-tag: ${{ steps.package.outputs.tag }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Read package metadata
              id: package
              shell: bash
              run: |
                  PACKAGE_NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['name'])")
                  PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
                  RELEASE_TAG="v${PACKAGE_VERSION}"

                  echo "name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
                  echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
                  echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

                  echo "Package: ${PACKAGE_NAME}"
                  echo "Version: ${PACKAGE_VERSION}"
                  echo "Tag:     ${RELEASE_TAG}"

            - name: Verify release tag does not already exist
              shell: bash
              run: |
                  TAG="${{ steps.package.outputs.tag }}"

                  if git rev-parse "${TAG}" >/dev/null 2>&1; then
                      echo "Release tag ${TAG} already exists."
                      exit 1
                  fi

    # -------------------------------------------------------------------------
    # STEP 2: Build protected binary wheels for every supported operating system
    # -------------------------------------------------------------------------
    build-wheels:
        name: Build wheels on ${{ matrix.os }}
        needs:
            - prepare-release

        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - windows-latest
                    - macos-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Install deployment dependencies
              run: python -m pip install --upgrade pip typer tqdm cibuildwheel

            - name: Build protected release wheels
              env:
                  CIBW_BUILD: "cp313-*"
              run: python resources/scripts/deploy.py --src . --output-dir wheelhouse

            - name: Upload wheel artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: wheels-${{ matrix.os }}
                  path: ./wheelhouse/*.whl
                  if-no-files-found: error

    # -------------------------------------------------------------------------
    # STEP 3: Gather all compiled wheels and upload them to Wasabi PyPI
    # -------------------------------------------------------------------------
    upload-s3:
        name: Upload wheels to Wasabi PyPI
        needs:
            - build-wheels

        runs-on: ubuntu-latest

        steps:
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Install s3pypi
              run: python -m pip install --upgrade s3pypi

            - name: Download all compiled wheels
              uses: actions/download-artifact@v4
              with:
                  pattern: wheels-*
                  path: dist
                  merge-multiple: true

            - name: Upload to Wasabi S3 PyPI
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  AWS_ENDPOINT_URL: https://s3.eu-central-2.wasabisys.com
                  AWS_REGION: eu-central-2
                  AWS_DEFAULT_REGION: eu-central-2
              run: s3pypi upload dist/* --bucket pypi.haight.com.de --index.html

    # -------------------------------------------------------------------------
    # STEP 4: Verify that the deployed package can be installed on all supported
    # operating system and Python combinations
    # -------------------------------------------------------------------------
    # test-deployment:
    #     name: Test deployment on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    #     needs:
    #         - prepare-release
    #         - upload-s3

    #     runs-on: ${{ matrix.os }}

    #     strategy:
    #         fail-fast: false
    #         matrix:
    #             os:
    #                 - ubuntu-latest
    #                 - windows-latest
    #                 - macos-latest

    #             python-version:
    #                 - "3.13"

    #     steps:
    #         - name: Set up Python
    #           uses: actions/setup-python@v5
    #           with:
    #               python-version: ${{ matrix.python-version }}

    #         - name: Upgrade pip
    #           run: python -m pip install --upgrade pip

    #         - name: Install deployed package
    #           run: python -m pip install --extra-index-url https://pypi.haight.com.de/ "${{ needs.prepare-release.outputs.package-name }}==${{ needs.prepare-release.outputs.package-version }}"

    #         - name: Verify installed distribution
    #           shell: bash
    #           run: |
    #               python -c "import importlib.metadata; name='${{ needs.prepare-release.outputs.package-name }}'; expected='${{ needs.prepare-release.outputs.package-version }}'; installed=importlib.metadata.version(name); print(f'{name} {installed} successfully installed'); assert installed == expected, f'Expected {expected}, got {installed}'"

    # -------------------------------------------------------------------------
    # STEP 5: Create the Git tag and GitHub Release
    #
    # This job runs only after every deployment verification job succeeds.
    # gh release create creates the missing Git tag and points it explicitly to
    # the exact main commit that triggered this workflow.
    # -------------------------------------------------------------------------
    publish-release:
        name: Publish GitHub Release
        needs:
            - prepare-release
            - upload-s3
            # - test-deployment

        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Download all compiled wheels
              uses: actions/download-artifact@v4
              with:
                  pattern: wheels-*
                  path: dist
                  merge-multiple: true

            - name: Extract current changelog entry
              shell: bash
              run: |
                  awk '
                      /^## \[/ {
                          if (found) exit
                          found=1
                      }
                      found
                  ' src/.info/CHANGELOG.md > RELEASE_NOTES.md

            - name: Create Git tag and GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: bash
              run: |
                  gh release create "${{ needs.prepare-release.outputs.release-tag }}" dist/*.whl \
                      --target "${{ github.sha }}" \
                      --notes-file RELEASE_NOTES.md
{% endraw %}
