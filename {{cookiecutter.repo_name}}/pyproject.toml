[build-system]
requires = [
    "setuptools>=69",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "{{ cookiecutter.package_name }}"
version = "{{ cookiecutter.version }}"
description = {{ '{0!r}'.format(cookiecutter.project_short_description).lstrip('ub') }}
readme = "README.md"
requires-python = ">=3.11"
{%- if cookiecutter.full_name or cookiecutter.email %}
authors = [
{%- if cookiecutter.full_name and cookiecutter.email %}
    { name = {{ '{0!r}'.format(cookiecutter.full_name).lstrip('ub') }}, email = {{ '{0!r}'.format(cookiecutter.email).lstrip('ub') }} },
{%- elif cookiecutter.full_name %}
    { name = {{ '{0!r}'.format(cookiecutter.full_name).lstrip('ub') }} },
{%- else %}
    { email = {{ '{0!r}'.format(cookiecutter.email).lstrip('ub') }} },
{%- endif %}
]
{%- endif %}
{%- if cookiecutter.license != "no" %}
license = { text = "{{ cookiecutter.license }}" }
{%- endif %}
keywords = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
{%- if cookiecutter.license == "no" %}
{%- elif cookiecutter.license in ["BSD 2-Clause License", "BSD 3-Clause License"] %}
    "License :: OSI Approved :: BSD License",
{%- elif cookiecutter.license == "MIT license" %}
    "License :: OSI Approved :: MIT License",
{%- elif cookiecutter.license == "ISC license" %}
    "License :: OSI Approved :: ISC License (ISCL)",
{%- elif cookiecutter.license == "Apache Software License 2.0" %}
    "License :: OSI Approved :: Apache Software License",
{%- elif 'LGPLv3+' in cookiecutter.license %}
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
{%- elif 'LGPLv3' in cookiecutter.license %}
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
{%- elif 'LGPLv2+' in cookiecutter.license %}
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
{%- elif 'LGPLv2' in cookiecutter.license %}
    "License :: OSI Approved :: GNU Lesser General Public License v2 (LGPLv2)",
{%- endif %}
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Utilities",
{%- if cookiecutter.pypi_disable_upload == "yes" %}
    "Private :: Do Not Upload",
{%- endif %}
]
dependencies = [
    "typer>=0.12",
]

{%- if cookiecutter.repo_hosting_domain and cookiecutter.repo_username %}
[project.urls]
Homepage = "https://{{ cookiecutter.repo_hosting_domain }}/{{ cookiecutter.repo_username }}/{{ cookiecutter.repo_name }}"
Issues = "https://{{ cookiecutter.repo_hosting_domain }}/{{ cookiecutter.repo_username }}/{{ cookiecutter.repo_name }}/issues"
Documentation = "{{ cookiecutter.sphinx_docs_hosting }}"
{%- endif %}

[project.scripts]
{{ cookiecutter.command_line_interface_bin_name }} = "{{ cookiecutter.package_name }}.cli:app"

[project.optional-dependencies]
dev = [
    "bumpver",
    "matplotlib",
    "pytest>=8.4.2",
    "timm",
    "ruff==0.16.1",
    "sphinx",
    "shibuya",
    "jupyterlab",
    "twine",
    "build",
    "tqdm",
    "import-linter",
    "pre-commit>=3.7",
    "pytest-cov>=5.0",
]
docs = [
    "sphinx>=7.0",
    "{{ cookiecutter.sphinx_theme }}",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["{{ cookiecutter.package_name }}*"]

[tool.pytest.ini_options]
norecursedirs = ["migrations"]
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = [
    "-ra",
    "--strict-markers",
{%- if cookiecutter.allow_tests_inside_package == 'yes' %}
    "--pyargs",
{%- endif %}
    "--doctest-modules",
    "--doctest-glob=*.rst",
    "--tb=short",
]
{%- if cookiecutter.allow_tests_inside_package == 'yes' %}
testpaths = ["{{ cookiecutter.package_name }}", "tests"]
{%- else %}
testpaths = ["tests"]
{%- endif %}
filterwarnings = ["error"]

[tool.bumpver]
current_version = "{{ cookiecutter.version }}"
version_pattern = "YYYY.MM.PATCH"
commit_message = "ver({{ cookiecutter.package_name }}): bump version from {old_version} -> {new_version}"
commit = true
tag = false
push = true
version_regex = "(?P<year>[0-9]{4})\\.(?P<month>[0-9]{1,2})\\.(?P<patch>[0-9]+)"
version_replacement = "{year}.{month}.{patch}"

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
"README.md" = [
    "v-{version}",
]
"src/{{ cookiecutter.package_name }}/version.py" = [
    '__version__ = "{version}"',
]
"src/.info/CHANGELOG.md" = [
    '## \[{version}\]',
]
"resources/docs/conf.py" = [
    'version = release = "{version}"',
]
"resources/docs/readme.rst" = [
    '{{ cookiecutter.project_name }} \[v-{version}\]',
]


[tool.ruff]
line-length = 140
extend-exclude = ["resources/docs/conf.py", "resources/scripts/deploy.py"]
preview = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "blind-except",
    "any-type",
    "missing-trailing-comma",
    "multi-line-summary-second-line",
    "missing-trailing-period",
    "non-imperative-mood",
    "missing-blank-line-after-last-section",
    "missing-terminal-punctuation",
    "EM",
    "raw-string-in-exception",
    "commented-out-code",
    "boolean-type-hint-positional-argument",
    "boolean-default-value-positional-argument",
    "too-many-arguments",
    "PTH",
    "unnecessary-assign",
    "print",
    "raise-vanilla-args",
    "complex-structure",
    "too-many-positional-arguments",
    "magic-value-comparison",
    "missing-blank-line-after-summary",
    "camelcase-imported-as-acronym",
    "non-empty-init-module",
    "too-many-statements-in-try-clause",
    "too-many-branches",
    "too-many-statements",
    "too-many-locals",
]

[tool.ruff.lint.per-file-ignores]
"resources/docs/conf.py" = ["builtin-variable-shadowing", "undocumented-public-module", "implicit-namespace-package", "bad-quotes-inline-string", "utf8-encoding-declaration", "format-literals", "printf-string-formatting", "f-string", "unsorted-imports", "missing-trailing-comma"]
"resources/scripts/*.py" = ["undocumented-public-module", "implicit-namespace-package", "utf8-encoding-declaration"]
"tests/*.py" = ["missing-return-type-undocumented-public-function", "undocumented-public-module", "undocumented-public-function", "implicit-namespace-package", "map-int-version-parsing", "assert", "incorrect-dict-iterator", "unused-loop-control-variable", "magic-value-comparison", "non-lowercase-variable-in-function", "import-outside-top-level", "missing-return-type-private-function"]
"src/**/__init__.py" = ["non-empty-init-module", "unused-import", "missing-copyright-notice", "undefined-local-with-import-star", "undocumented-public-package"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.importlinter]
root_package = "{{ cookiecutter.package_name }}"

[[tool.importlinter.contracts]]
name = "CLI must not import the module entrypoint"
type = "forbidden"
source_modules = ["{{ cookiecutter.package_name }}.cli"]
forbidden_modules = ["{{ cookiecutter.package_name }}.__main__"]
allow_indirect_imports = false
